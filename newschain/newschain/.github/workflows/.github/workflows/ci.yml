

```yaml
name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "bugfix/**"

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  GO_VERSION: "1.24"

jobs:
  go-ci:
    name: Go CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify Go Version
        run: go version

      - name: Download Dependencies
        run: go mod download

      - name: Verify Dependencies
        run: go mod verify

      - name: Check Formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Build Application
        run: go build -v ./...

  solidity-ci:
    name: Solidity CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Verify Foundry Installation
        run: forge --version

      - name: Compile Smart Contracts
        run: |
          if [ -d "contracts" ]; then
            forge build
          else
            echo "No contracts directory found."
          fi

  lint:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m

  security:
    name: Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - go-ci
      - solidity-ci
      - lint
      - security

    steps:
      - name: Success
        run: |
          echo "=================================="
          echo "NewsChain CI completed successfully"
          echo "=================================="
```
